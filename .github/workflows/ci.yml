name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build:data
      - name: Check that data/guide.json is up to date
        run: git diff --exit-code -I '"generated_at"' data/guide.json
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API tests against Postgres
        run: node --disable-warning=ExperimentalWarning --test test/api.test.js
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vi_test
